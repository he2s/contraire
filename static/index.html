    --ok-bg: transparent; --ok-fg: #5FD69A; --ok: #3CC47E;
    --bad-bg: #FF4A2E; --bad-fg: #0B0B0B; --bad: #FF4A2E;
    --warn-bg: transparent; --warn-fg: #FFC04D; --warn: #FFB020;
    --off-bg: transparent; --off-fg: #ABA8A3; --off: #75726D;
    --danger-line: #FF4A2E; --danger: #FF8A73;
    --invert: #F2F1EF; --invert-fg: #0B0B0B;

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 var(--body); -webkit-font-smoothing: antialiased; }
a { color: var(--link); text-underline-offset: 2px; }
button, input, select { font: inherit; color: inherit; border-radius: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.mono { font-family: var(--mono); }
.muted { color: var(--muted); }

/* Scrollbars follow the theme: square thumb in ink on a quiet track. */
html, .side, .table .scroll, .loglines, .doc pre, .envlist { scrollbar-color: var(--thumb) var(--thumb-track); scrollbar-width: thin; }
.loglines, .doc pre { scrollbar-color: var(--console-dim) var(--console); }

::-webkit-scrollbar-track { background: var(--thumb-track); }

::-webkit-scrollbar-thumb:hover { background: var(--accent); }
.loglines::-webkit-scrollbar-track, .doc pre::-webkit-scrollbar-track { background: var(--console); }
.loglines::-webkit-scrollbar-thumb, .doc pre::-webkit-scrollbar-thumb { background: var(--console-dim); border-color: var(--console); }

/* shell */
.app { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--side); border-right: var(--rule) solid var(--line); padding: 0; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.side > * { border-bottom: var(--rule) solid var(--line); }
.side > .foot, .side > .seg { border-bottom: 0; }
main { min-width: 0; padding: 28px clamp(16px, 2.4vw, 40px) 56px; display: flex; flex-direction: column; gap: 24px; }

  .app { grid-template-columns: 1fr; }

  .side .host-box, .side .self-box { display: none; }
}

.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text); padding: 18px 16px; }
.brand .mark { flex: none; width: 40px; height: 40px; display: grid; place-items: center; background: var(--accent); color: #fff; font-weight: 800; font-size: 22px; letter-spacing: -0.04em; }
.brand b { display: block; font-family: var(--display); font-size: 15px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.15; hyphens: auto; overflow-wrap: anywhere; }
.brand small { display: block; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 3px; }
.conn { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--panel); }
.conn .ic { flex: none; display: grid; place-items: center; width: 30px; height: 30px; background: var(--ok); color: #fff; }
.conn.off .ic { background: var(--bad); }
.conn strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conn span { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ok-fg); }
.conn.off span { color: var(--accent-ink); }
.navlabel { padding: 12px 16px 10px; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text); border-bottom: var(--rule) solid var(--line); }
.nav { display: flex; flex-direction: column; }
.nav a { display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 0 16px; text-decoration: none; color: var(--text); font-weight: 600; border-bottom: 1px solid var(--line-soft); transition: background .12s; }
.nav a:last-child { border-bottom: 0; }
.nav a:hover { background: var(--chip); }
.nav a[aria-current="page"] { background: var(--accent); color: #fff; }
.nav a[aria-current="page"] .count { background: transparent; color: #fff; border-color: #fff; }
.nav a span:first-of-type { flex: 1; }
.count { font-family: var(--mono); font-size: 12px; font-weight: 600; padding: 0 6px; border: 1.5px solid var(--line); color: var(--text); }
@media (max-width: 900px) { .nav { flex-direction: row; flex-wrap: wrap; } .nav a { flex: 1 1 160px; } }
.sbox { display: flex; flex-direction: column; gap: 9px; padding: 14px 16px; background: var(--panel); }
.sbox .k { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text); display: flex; justify-content: space-between; align-items: center; }
.kv { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.kv span:last-child { font-family: var(--mono); font-size: 12px; text-align: right; font-weight: 500; }
.bar { height: 8px; background: var(--track); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--text); transition: width .5s; }
.seg { display: flex; padding: 12px 16px; gap: 0; background: var(--side); }
.seg button { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; border: 1.5px solid var(--line); margin-left: -1.5px; background: var(--panel-2); cursor: pointer; color: var(--text); font-size: 12px; font-weight: 700; }
.seg button:first-child { margin-left: 0; }
.seg button[aria-pressed="true"] { background: var(--invert); color: var(--invert-fg); }
.foot { margin-top: auto; padding: 14px 16px; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; border-top: var(--rule) solid var(--line); }
.foot .mono { font-size: 11.5px; overflow-wrap: anywhere; }

/* page header */
.ph { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
.ph .kick { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text); }
.ph h1 { margin: 6px 0 0; font-family: var(--display); font-size: 46px; line-height: 1; font-weight: 800; letter-spacing: -0.03em; }
.ph .tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; flex: 0 1 600px; justify-content: flex-end; }
.field { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; background: var(--panel-2); border: var(--rule) solid var(--line); flex: 1 1 260px; color: var(--muted); }
.field:focus-within { outline: 3px solid var(--accent); outline-offset: 1px; }
.field input { border: 0; outline: none; background: transparent; color: var(--text); flex: 1; min-width: 0; height: 100%; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 16px; border: var(--rule) solid var(--line); background: var(--panel-2); color: var(--text); font-weight: 700; cursor: pointer; text-decoration: none; white-space: nowrap; transition: background .12s, color .12s; }
.btn:hover { background: var(--invert); color: var(--invert-fg); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--invert); border-color: var(--invert); color: var(--invert-fg); }
.btn.dark { background: var(--invert); border-color: var(--invert); color: var(--invert-fg); }
.btn.danger { color: var(--danger); border-color: var(--line); }
.btn.danger:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.sm { height: 36px; padding: 0 12px; font-size: 13px; }
.ib { display: inline-grid; place-items: center; width: 38px; height: 38px; border: 0; background: transparent; color: var(--text); cursor: pointer; transition: background .12s, color .12s; flex: none; }
.ib:hover { background: var(--invert); color: var(--invert-fg); }
.ib.go { color: var(--ok); } .ib.bad:hover { background: var(--accent); color: #fff; }
.ib:disabled { opacity: .3; pointer-events: none; }
.ib.xs { width: 26px; height: 26px; }

/* cards */
.card { background: var(--panel); border: var(--rule) solid var(--line); padding: 18px 20px; }
.card h2 { margin: 0; font-family: var(--display); font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
/* Ruled grid: each cell's outline overlaps its neighbours', giving single 2px rules without empty filler cells. */
.grid { display: grid; gap: 0; grid-template-columns: repeat(auto-fit, minmax(min(250px, 100%), 1fr)); padding: calc(var(--rule) / 2); }
.grid > .card { border: 0; outline: var(--rule) solid var(--line); outline-offset: calc(var(--rule) / -2); margin: calc(var(--rule) / -2); }
.grid.wide { grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); }
.grid.loose { gap: 24px; border: 0; background: transparent; }
.grid.loose > .card { border: var(--rule) solid var(--line); margin: 0; box-shadow: none; }
.stat { display: flex; flex-direction: column; gap: 10px; }
.stat .top { display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text); }
.stat .top .mono { font-weight: 500; font-size: 12px; letter-spacing: 0; text-transform: none; color: var(--muted); }
.big { font-family: var(--display); font-size: 40px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
.big.red { color: var(--accent-ink); }
.stat .row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.stat .row span:not(.big) { color: var(--muted); font-size: 13px; }
.stat .foot2 { font-size: 12px; color: var(--muted); margin-top: auto; }
.comp { display: flex; height: 12px; overflow: hidden; background: var(--track); gap: 2px; margin-top: auto; }
.comp i { display: block; transition: flex-grow .5s; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; }

/* mood: a status strip of ruled cells */
.mood { display: flex; flex-wrap: wrap; align-items: stretch; gap: 0; padding: 0; }
.mood .badge { flex: none; display: grid; place-items: center; width: 64px; background: var(--accent); color: #fff; font-weight: 800; font-size: 26px; }
.mood .badge.ok { background: var(--invert); color: var(--invert-fg); }
.mood .txt { display: flex; flex-direction: column; justify-content: center; gap: 2px; flex: 1 1 320px; padding: 14px 20px; }
.mood strong { font-family: var(--display); font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
.mood > .btn { align-self: center; margin: 12px 16px; }

/* chips + table */
.chips { display: flex; flex-wrap: wrap; gap: 0; }
.chipf { display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 14px; font-weight: 700; cursor: pointer; background: var(--panel-2); color: var(--text); border: var(--rule) solid var(--line); margin-left: calc(var(--rule) * -1); }
.chipf:first-child { margin-left: 0; }
.chipf .d { width: 9px; height: 9px; }
.chipf .n { font-family: var(--mono); font-size: 12px; font-weight: 600; padding: 0 6px; border: 1.5px solid currentColor; }
.chipf[aria-pressed="true"] { background: var(--invert); color: var(--invert-fg); }
.chipf[aria-pressed="true"] .d { outline: 1.5px solid var(--invert-fg); }
.table { background: var(--panel); border: var(--rule) solid var(--line); overflow: hidden; }
.table .scroll { overflow-x: auto; }
.tr { display: grid; grid-template-columns: minmax(260px, 2.6fr) 130px minmax(150px, 1.3fr) minmax(150px, 1.1fr) 140px; align-items: center; gap: 12px; padding: 8px 16px; min-height: 62px; border-top: 1px solid var(--line-soft); min-width: 860px; }
.tr.th { min-height: 40px; background: var(--panel); border-top: 0; border-bottom: var(--rule) solid var(--line); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text); }
.tr.th + .tr { border-top: 0; }
.tr.th span:last-child { text-align: right; }
.tr:not(.th) { cursor: pointer; transition: background .1s; }
.tr:not(.th):hover { background: var(--panel-2); box-shadow: inset 4px 0 0 var(--accent); }
.act-tr { grid-template-columns: 130px minmax(180px, 1.2fr) minmax(160px, 1fr) minmax(160px, 1fr) minmax(180px, 1.3fr); }
.img-tr { grid-template-columns: minmax(260px, 2.4fr) minmax(160px, 1fr) 120px minmax(160px, 1.2fr) 70px; }
.nm { display: flex; align-items: center; gap: 12px; min-width: 0; }
.nm > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.nm .t { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.nm b { font-weight: 700; font-size: 15px; }
.nm .rep { color: var(--muted); font-weight: 600; font-size: 13px; }
.nm .im { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nm .im .tag, .tag { color: var(--faint); }
.dot { flex: none; width: 10px; height: 10px; background: var(--off); }
.pulse { animation: pulse 2s steps(2) infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.busy-dot { background: var(--accent) !important; animation: blink .8s steps(2) infinite; }
@keyframes blink { 50% { opacity: .2; } }
.stk { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; padding: 1px 7px; border: 1.5px solid var(--line); color: var(--text); text-decoration: none; background: var(--panel-2); }
a.stk:hover { background: var(--invert); color: var(--invert-fg); }
.stk i, .sq { width: 8px; height: 8px; background: hsl(var(--h) 70% 48%); flex: none; }
.pill { justify-self: start; display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; font-size: 12px; font-weight: 700; white-space: nowrap; border: 1.5px solid var(--line); background: var(--panel-2); color: var(--text); }
.s-ok::before, .s-warn::before, .s-off::before { content: ""; width: 8px; height: 8px; background: var(--ok); }
.s-warn::before { background: var(--warn); } .s-off::before { background: var(--off); }
.s-bad { background: var(--bad); border-color: var(--bad); color: var(--bad-fg); }
.s-busy { background: var(--invert); border-color: var(--invert); color: var(--invert-fg); }
.ports { display: flex; flex-wrap: wrap; gap: 6px; }
.port { font-family: var(--mono); font-size: 12px; font-weight: 500; padding: 1px 7px; border: 1.5px solid var(--line); color: var(--text); text-decoration: none; background: var(--panel-2); }
a.port:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
.acts { display: flex; justify-content: flex-end; gap: 0; }
.empty { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 48px 16px 56px; text-align: center; }
.empty strong { font-family: var(--display); font-size: 22px; font-weight: 800; }
.skel { height: 12px; background: linear-gradient(90deg, var(--track), var(--panel-2), var(--track)); background-size: 200% 100%; animation: sk 1.2s infinite linear; }
@keyframes sk { to { background-position: -200% 0; } }
.glyph { display: grid; place-items: center; width: 56px; height: 56px; background: var(--invert); color: var(--invert-fg); font-weight: 800; font-size: 26px; }

/* events */
.events { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; }
.events li { display: grid; grid-template-columns: 70px 12px 1fr; gap: 12px; padding: 8px 0; align-items: start; border-top: 1px solid var(--line-soft); }
.events li:first-child { border-top: 0; }
.events .t { font-family: var(--mono); font-size: 12px; color: var(--muted); padding-top: 1px; }
.events .d { width: 10px; height: 10px; margin-top: 4px; }

/* stacks */
.stacks { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
.stacklist { flex: 1 1 280px; display: flex; flex-direction: column; min-width: 0; max-width: 420px; border: var(--rule) solid var(--line); }
.scard { display: flex; flex-direction: column; gap: 10px; text-align: left; padding: 14px 16px; color: var(--text); cursor: pointer; background: var(--panel); border-top: 1px solid var(--line-soft); text-decoration: none; }
.scard:first-child { border-top: 0; }
.scard:hover { background: var(--panel-2); }
.scard[aria-current="true"] { background: var(--accent); color: #fff; }
.scard[aria-current="true"] .svcdot { background: rgba(255,255,255,.15); color: #fff; border-color: rgba(255,255,255,.6); }
.scard[aria-current="true"] .pill { background: transparent; color: #fff; border-color: #fff; }
.scard .h { display: flex; align-items: center; gap: 10px; }
.scard .h b { font-family: var(--display); font-size: 18px; font-weight: 800; letter-spacing: -0.01em; flex: 1; overflow-wrap: anywhere; }

/* modal + toast */
.modal { position: fixed; inset: 0; display: grid; place-items: center; z-index: 30; background: rgba(17,17,17,.45); }
.modal .box { background: var(--panel); border: var(--rule) solid var(--line); padding: 22px; width: min(460px, calc(100vw - 32px)); box-shadow: 12px 12px 0 rgba(17,17,17,.25); }

.toast.err { background: var(--accent); border-color: var(--accent); color: #fff; }
@keyframes up { from { transform: translateY(6px); opacity: 0; } }
</style>
</head>
<body>
<div class="app">

<script>
"use strict";
const $ = s => document.querySelector(s);
/* Fonts load from Google without blocking the page; offline, system fonts stand in. */
document.head.append(Object.assign(document.createElement("link"), { rel: "stylesheet",
  href: "https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" }));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const I = {
  play: '<path d="M8 5.5v13l11-6.5-11-6.5z"/>',
  stop: '<rect x="6" y="6" width="12" height="12" rx="2.5"/>',
  restart: '<path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/>',
  pause: '<path d="M9 5v14M15 5v14"/>',
  trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  logs: '<path d="M4 6h16M4 12h10M4 18h13"/>',
  copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  chev: '<path d="M9 6l6 6-6 6"/>',
  down: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  pull: '<path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 21h16"/>',
};
const icon = (n, s = 18, w = 2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;
const copyBtn = (text, label = "Copy") => `<button class="ib xs" data-copy="${esc(text)}" title="${label}" aria-label="${label}">${icon("copy", 14)}</button>`;
const hue = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const BOAT = () => `<span class="glyph" aria-hidden="true">0</span>`;

const fmtBytes = b => {
  if (b == null || isNaN(b)) return "–";
  const u = ["B", "KB", "MB", "GB", "TB"]; let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return (b >= 100 || i === 0 ? b.toFixed(0) : b.toFixed(1)) + " " + u[i];
};
const ago = t => {
  const s = Date.now() / 1000 - t;
  if (s < 60) return "just now";
  for (const [d, n] of [[31536000, "y"], [2592000, "mo"], [86400, "d"], [3600, "h"], [60, "m"]])
    if (s >= d) return Math.floor(s / d) + n + " ago";
};
const dur = s => s < 60 ? `${s | 0}s` : s < 3600 ? `${s / 60 | 0}m ${s % 60 | 0}s` : s < 86400 ? `${s / 3600 | 0}h ${(s % 3600) / 60 | 0}m` : `${s / 86400 | 0}d ${(s % 86400) / 3600 | 0}h`;
const clock = t => { const d = new Date(t * 1000), now = new Date(); return d.toDateString() === now.toDateString() ? d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : d.toLocaleDateString([], { weekday: "short" }) + " " + d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); };

let auditTimer = 0;
async function api(path, opts = {}) {
  // Every change lands in the audit log; refresh the Activity view shortly after.
  if (opts.method && opts.method !== "GET") { clearTimeout(auditTimer); auditTimer = setTimeout(() => loadAudit(), 300); }
  const r = await fetch(path, { ...opts, headers: { "X-Contraire": "1", "Content-Type": "application/json", ...(opts.headers || {}) } });
  if (!r.ok) {
    let msg = r.statusText;
    try { msg = (await r.json()).message || msg; } catch {}
    throw new Error(msg);
  }
  if (r.status === 204) return null;
  return (r.headers.get("content-type") || "").includes("json") ? r.json() : r.text();
}

function toast(msg, err) {
  const el = document.createElement("div");
  el.className = "toast" + (err ? " err" : "");
  el.textContent = msg;
  $("#toasts").append(el);
  setTimeout(() => el.remove(), err ? 6000 : 3000);
}

/* Clipboard API needs a secure context; plain http on a LAN falls back to execCommand. */
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  const ta = Object.assign(document.createElement("textarea"), { value: text });
  ta.style.cssText = "position:fixed;opacity:0";
  document.body.append(ta); ta.select();
  const ok = document.execCommand("copy"); ta.remove(); return ok;
}

function ask({ title, text, ok = "Confirm", danger, extra = "" }) {
  return new Promise(res => {
    const prev = document.activeElement;
    $("#m-title").textContent = title;
    $("#m-text").textContent = text;
    $("#m-extra").innerHTML = extra;
    const okb = $("#m-ok");
    okb.textContent = ok;
    okb.className = "btn " + (danger ? "danger" : "primary");
    $("#modal").hidden = false;
    const first = $("#m-extra input"); (first || okb).focus();
    const done = v => {
      $("#modal").hidden = true;
      okb.onclick = $("#m-cancel").onclick = $("#modal").onkeydown = null;
      prev?.focus?.();
      res(v);
    };
    okb.onclick = () => done(first ? first.value : true);
    $("#m-cancel").onclick = () => done(false);
    $("#modal").onkeydown = e => { if (e.key === "Escape") done(false); if (e.key === "Enter") okb.click(); };
  });
}

/* ---------- theme ---------- */
function setTheme(t) {
  if (t === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
  try { t === "auto" ? localStorage.removeItem("theme") : localStorage.setItem("theme", t); } catch {}
  document.querySelectorAll("[data-theme-set]").forEach(b => b.setAttribute("aria-pressed", b.dataset.themeSet === t));
}

/* ---------- state ---------- */
const S = {
  view: "containers", arg: null, containers: [], images: [], info: null, cfg: null, self: null, selfHist: [],
  busy: new Set(), open: null, detail: null, hist: [], events: [], filter: "all", q: "", tab: "logs",
};
const PROJ = "com.docker.compose.project";
const L = (c, k) => c.Labels?.[k];
const cname = c => (c.Names?.[0] || c.Id.slice(0, 12)).replace(/^\//, "");
const HEALTH = /\((healthy|unhealthy|health: starting)\)/;
const health = c => (c.Status.match(HEALTH) || [])[1] || null;
/* One status vocabulary everywhere: label, colour class, dot colour, filter bucket. */
function status(c) {
  if (S.busy.has(c.Id)) return { label: "Working…", cls: "s-busy", dot: "var(--accent)", bucket: "running", busy: true };
  const h = health(c);
  if (c.State === "running" && h === "unhealthy") return { label: "Unhealthy", cls: "s-bad", dot: "var(--bad)", bucket: "attention" };
  if (c.State === "running" && h === "health: starting") return { label: "Starting", cls: "s-warn", dot: "var(--warn)", bucket: "running" };
  if (c.State === "running") return { label: "Running", cls: "s-ok", dot: "var(--ok)", bucket: "running", pulse: true };
  if (c.State === "paused") return { label: "Paused", cls: "s-warn", dot: "var(--warn)", bucket: "paused" };
  if (c.State === "restarting") return { label: "Restarting", cls: "s-warn", dot: "var(--warn)", bucket: "attention" };
  if (c.State === "dead" || (c.State === "exited" && !/\(0\)/.test(c.Status))) {
    const code = (c.Status.match(/\((\d+)\)/) || [])[1];
    return { label: code ? `Failed (${code})` : "Failed", cls: "s-bad", dot: "var(--bad)", bucket: "attention" };
  }
  if (c.State === "created") return { label: "Created", cls: "s-off", dot: "var(--off)", bucket: "stopped" };
  return { label: "Exited", cls: "s-off", dot: "var(--off)", bucket: "stopped" };
}
const projects = () => {
  const m = new Map();
  for (const c of S.containers) { const p = L(c, PROJ); if (p) { if (!m.has(p)) m.set(p, []); m.get(p).push(c); } }
  return [...m.entries()].sort((a, b) => a[0].localeCompare(b[0]));
};
function displayName(c) {
  const svc = L(c, "com.docker.compose.service");
  if (!svc || L(c, "com.docker.compose.oneoff") === "True") return esc(cname(c));
  const reps = S.containers.filter(x => L(x, PROJ) === L(c, PROJ) && L(x, "com.docker.compose.service") === svc).length;
  return esc(svc) + (reps > 1 ? ` <span class="rep">#${esc(L(c, "com.docker.compose.container-number") || "?")}</span>` : "");
}
const imageHtml = img => {
  const m = String(img).match(/^(.*?)(:[^:/@]+)?(@sha256:.*)?$/);
  return esc(m[1]) + (m[2] ? `<span class="tag">${esc(m[2])}</span>` : "") + (m[3] ? `<span class="tag">@${esc(m[3].slice(8, 20))}</span>` : "");
};
const ports = c => {
  const seen = new Set(), out = [];
  for (const p of c.Ports || []) {
    const k = `${p.PublicPort || ""}:${p.PrivatePort}/${p.Type}`;
    if (seen.has(k)) continue; seen.add(k); out.push(p);
  }
  return out.sort((a, b) => (a.PublicPort || 1e6) - (b.PublicPort || 1e6) || a.PrivatePort - b.PrivatePort);
};
const portHtml = (c, max = 3) => {
  const ps = ports(c);
  if (!ps.length) return '<span class="muted">internal</span>';
  return ps.slice(0, max).map(p => p.PublicPort
    ? `<a class="port" href="${p.PrivatePort === 443 ? "https" : "http"}://${esc(location.hostname)}:${p.PublicPort}" target="_blank" rel="noopener" data-stop title="Open port ${p.PublicPort} (container port ${p.PrivatePort})">:${p.PublicPort}</a>`
    : `<span class="port" title="not published to the host">${p.PrivatePort}/${esc(p.Type)}</span>`).join("") + (ps.length > max ? `<span class="port">+${ps.length - max}</span>` : "");
};
const stackChip = c => { const p = L(c, PROJ); return p ? `<a class="stk" href="#stacks/${encodeURIComponent(p)}" data-stop style="--h:${hue(p)}"><i></i>${esc(p)}</a>` : ""; };
const dotHtml = (st, extra = "") => `<span class="dot${st.pulse ? " pulse" : ""}${st.busy ? " busy-dot" : ""}" style="background:${st.dot}${extra}"></span>`;

function actionButtons(c, labelled) {
  const b = S.busy.has(c.Id) ? "disabled" : "";
  const name = esc(cname(c));
  const btn = (a, n, cls, title) => labelled
    ? `<button class="btn ${cls}" data-act="${a}" data-id="${esc(c.Id)}" ${b}>${icon(n, 17, 2.2)}${title}</button>`
    : `<button class="ib ${cls}" data-act="${a}" data-id="${esc(c.Id)}" title="${title} ${name}" aria-label="${title} ${name}" ${b}>${icon(n)}</button>`;
  const st = c.State;
  if (labelled) return (st === "running"
      ? btn("restart", "restart", "primary", "Restart") + btn("pause", "pause", "", "Pause") + btn("stop", "stop", "", "Stop")
      : st === "paused" ? btn("unpause", "play", "primary", "Resume") + btn("stop", "stop", "", "Stop")
      : btn("start", "play", "primary", "Start")) + btn("remove", "trash", "danger", "Remove");
  return (st === "running" || st === "restarting"
      ? btn("restart", "restart", "", "Restart") + btn("stop", "stop", "bad", "Stop")
      : st === "paused" ? btn("unpause", "play", "go", "Resume") + btn("stop", "stop", "bad", "Stop")
      : btn("start", "play", "go", "Start") + btn("remove", "trash", "bad", "Remove"))
    + `<a class="ib" href="#c/${esc(c.Id)}" title="Logs for ${name}" aria-label="Logs for ${name}" data-stop>${icon("logs")}</a>`;
}

/* ---------- views ---------- */
const kicker = () => S.info ? `${esc(S.info.name)} · Docker Engine ${esc(S.info.version)}` : "connecting…";

function viewContainers() {
  const cs = S.containers, sts = cs.map(status);
  const n = k => sts.filter(s => s.bucket === k).length;
  const counts = { all: cs.length, running: n("running"), attention: n("attention"), paused: n("paused"), stopped: n("stopped") };
  const troubled = cs.filter((c, i) => sts[i].bucket === "attention");
  const anyHealth = cs.some(c => health(c));
  const mood = !cs.length ? ["An empty harbour", "No containers yet. Open Learn to start your first one in under a minute."]
    : troubled.length ? ["Choppy waters", `${counts.running} of ${counts.all} containers are up. ${troubled.slice(0, 3).map(c => `${cname(c)} is ${status(c).label.toLowerCase()}`).join(", ")}${troubled.length > 3 ? ` and ${troubled.length - 3} more` : ""}.`]
    : counts.running === counts.all ? ["Smooth sailing", `All ${counts.all} containers are up${anyHealth ? " and every health check is passing" : ""}.`]
    : ["Calm waters", `${counts.running} of ${counts.all} containers are up; the rest were stopped on purpose.`];
  const imgBytes = S.images.reduce((a, i) => a + i.Size, 0);
  const used = new Set(cs.map(c => c.ImageID));
  const unused = S.images.filter(i => !used.has(i.Id));
  const unusedBytes = unused.reduce((a, i) => a + i.Size, 0);
  const comp = [["var(--ok)", counts.running], ["var(--warn)", counts.paused], ["var(--bad)", counts.attention], ["var(--off)", counts.stopped]].filter(x => x[1]);
  const chips = [["all", "All", "var(--text)"], ["running", "Running", "var(--ok)"], ["attention", "Needs attention", "var(--bad)"], ["paused", "Paused", "var(--warn)"], ["stopped", "Stopped", "var(--off)"]];

  return `
    <header class="ph">
      <div><div class="kick">${kicker()}</div><h1>Containers</h1></div>
      <div class="tools"><label class="field">${icon("search")}<span class="sr">Search containers</span><input type="search" id="q" value="${esc(S.q)}" placeholder="Search name, image, stack, port…  ( / )"></label></div>
    </header>
    <section class="card mood" aria-label="Status">
      <span class="badge${troubled.length ? "" : " ok"}" aria-hidden="true">${troubled.length ? "!" : "✓"}</span>
      <div class="txt"><strong>${mood[0]}</strong><span class="muted">${esc(mood[1])}</span></div>
      ${troubled.length ? `<a class="btn" href="#c/${esc(troubled[0].Id)}">Look at ${esc(cname(troubled[0]))}${icon("chev", 16, 2.2)}</a>` : ""}
    </section>
    <section class="grid" aria-label="Summary">
      <div class="card stat"><div class="top"><span>Running</span><span class="mono">of ${counts.all}</span></div>
        <div class="row"><span class="big">${counts.running}</span><span>${counts.paused ? counts.paused + " paused" : "containers up"}</span></div>
        <div class="comp">${comp.map(([c, v]) => `<i style="flex-grow:${v};background:${c}"></i>`).join("")}</div></div>
      <div class="card stat"><div class="top"><span>Needs attention</span>${counts.attention ? `<span class="pill s-bad" style="height:22px">${counts.attention}</span>` : '<span class="pill s-ok" style="height:22px">all good</span>'}</div>
        <div class="row"><span class="big${counts.attention ? " red" : ""}">${counts.attention}</span><span>${counts.attention ? "unhealthy or failed" : "nothing failing"}</span></div>
        <div class="foot2">${troubled.length ? troubled.slice(0, 3).map(c => esc(cname(c))).join(" · ") : `${counts.stopped} stopped on purpose`}</div></div>
      <div class="card stat"><div class="top"><span>Images</span><span class="mono">${S.images.length} images</span></div>
        <div class="row"><span class="big">${fmtBytes(imgBytes)}</span><span>on disk</span></div>
        <div class="foot2">${unused.length} unused · ${fmtBytes(unusedBytes)} reclaimable</div></div>
      <div class="card stat"><div class="top"><span>Host</span><span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ok-fg)"><span class="dot pulse" style="width:8px;height:8px;background:var(--ok)"></span>live</span></div>
        <div class="row"><span class="big">${S.info ? S.info.cpus + " CPU" : "–"}</span><span>${S.info ? fmtBytes(S.info.memory) + " RAM" : ""}</span></div>
        <div class="foot2">${S.info ? `${esc(S.info.os)} · ${esc(S.info.arch)}<br>kernel ${esc(S.info.kernel)}` : ""}</div></div>
    </section>
    <section aria-label="Containers" style="display:flex;flex-direction:column;gap:14px">
      <div class="chips" role="group" aria-label="Filter">${chips.map(([k, l, d]) => `<button class="chipf" data-filter="${k}" aria-pressed="${S.filter === k}"><span class="d" style="background:${d}"></span>${l}<span class="n">${counts[k]}</span></button>`).join("")}</div>
      <div class="table"><div class="scroll" id="rows">${rowsHtml()}</div></div>
    </section>
    <section class="grid wide">
      <div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Recent events</h2><span class="muted" style="font-size:13px">live from docker events</span></div><ol class="events" id="events">${eventsHtml()}</ol></div>
      <div class="card" style="display:flex;flex-direction:column;gap:14px"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Images on disk</h2><span class="mono muted" style="font-size:13px">${fmtBytes(imgBytes)}</span></div>
        <div class="comp" style="height:18px;border-radius:8px;margin:0">${imgBytes ? `<i style="flex-grow:${imgBytes - unusedBytes};background:var(--accent)"></i><i style="flex-grow:${unusedBytes};background:#FFB38A"></i>` : ""}</div>
        <div class="legend"><span><i style="background:var(--accent)"></i>in use · ${S.images.length - unused.length} · ${fmtBytes(imgBytes - unusedBytes)}</span><span><i style="background:#FFB38A"></i>unused · ${unused.length} · ${fmtBytes(unusedBytes)}</span></div>
        <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:auto;padding:14px 16px;border-radius:16px;background:var(--panel-2)">
          <span>${unused.length ? `${unused.length} image${unused.length === 1 ? " isn't" : "s aren't"} used by any container.` : "Every image is in use."}</span>
          <a class="btn dark sm" href="#images">Manage images</a></div></div>
    </section>`;
}

function rowsHtml() {
  const q = S.q.trim().toLowerCase();
  const list = S.containers.filter(c => (S.filter === "all" || status(c).bucket === S.filter) &&
    (!q || [cname(c), c.Image, c.Status, L(c, PROJ), L(c, "com.docker.compose.service"), ...(c.Ports || []).map(p => p.PublicPort)].join(" ").toLowerCase().includes(q)))
    .sort((a, b) => (L(a, PROJ) || "~").localeCompare(L(b, PROJ) || "~") || cname(a).localeCompare(cname(b)));
  const head = `<div class="tr th"><span>Name</span><span>Status</span><span>Ports</span><span>Up / since</span><span>Actions</span></div>`;
  if (!list.length) return head + `<div class="empty">${BOAT(80)}<strong>Nothing on deck</strong><span class="muted" style="max-width:340px">${S.containers.length ? "No containers match this filter. Try another search." : "No containers yet."}</span></div>`;
  return head + list.map(c => {
    const st = status(c);
    return `<div class="tr" data-href="#c/${esc(c.Id)}" tabindex="0" title="${esc(cname(c))}">
      <div class="nm">${dotHtml(st)}<div><div class="t"><b>${displayName(c)}</b>${stackChip(c)}</div><span class="im">${imageHtml(c.Image)}</span></div></div>
      <span class="pill ${st.cls}">${st.label}</span>
      <div class="ports">${portHtml(c)}</div>
      <span class="muted" style="font-size:13px">${esc(c.Status.replace(HEALTH, "").trim())}</span>
      <div class="acts">${actionButtons(c)}</div></div>`;
  }).join("");
}

/* Normalise Docker's raw event JSON (history) and our compact SSE form into one shape. */
function normEvent(e) {
  if (e.Type) return { t: e.Type, a: e.Action, id: e.Actor?.ID, name: e.Actor?.Attributes?.name, exit: e.Actor?.Attributes?.exitCode, time: e.time };
  return e;
}
function eventText(e) {
  const a = e.a || "", code = e.exit != null ? +e.exit : null;
  if (e.t === "image") return [{ pull: "was pulled", delete: "was deleted", untag: "was untagged", tag: "was tagged" }[a] || a, "var(--accent)"];
  if (a.startsWith("health_status")) { const h = a.split(": ")[1]; return [`health is now ${h}`, h === "healthy" ? "var(--ok)" : h === "unhealthy" ? "var(--bad)" : "var(--warn)"]; }
  return ({
    start: ["started", "var(--ok)"], restart: ["restarted", "var(--accent)"],
    die: [code ? `stopped with exit code ${code}` : "stopped", code ? "var(--bad)" : "var(--off)"],
    oom: ["ran out of memory", "var(--bad)"], pause: ["was paused", "var(--warn)"], unpause: ["resumed", "var(--ok)"],
    create: ["was created", "var(--off)"], destroy: ["was removed", "var(--off)"],
  })[a] || [a, "var(--off)"];
}
function eventsHtml() {
  if (!S.events.length) return `<li><span></span><span></span><span class="muted">No changes in the last hour. Events appear here the moment they happen.</span></li>`;
  return S.events.slice(0, 8).map(e => {
    const [what, c] = eventText(e);
    const who = e.t === "image" ? (e.id || "").replace(/^sha256:/, "").slice(0, 40) : (e.name || (e.id || "").slice(0, 12));
    return `<li><span class="t">${e.time ? clock(e.time) : ""}</span><span class="d" style="background:${c}"></span><span><strong>${esc(who)}</strong> ${esc(what)}</span></li>`;
  }).join("");
}

function viewStacks() {
  const ps = projects();
  if (!ps.length) return `<header class="ph"><div><div class="kick">docker compose</div><h1>Stacks</h1></div></header>
    <div class="card empty" style="border-top:0">${BOAT(80)}<strong>No compose stacks running</strong><span class="muted" style="max-width:420px">Containers started with <code>docker compose up</code> show up here as a stack. See the Compose lesson in Learn.</span><a class="btn" href="#learn/compose">Open the Compose lesson</a></div>`;
  const cur = ps.find(p => p[0] === S.arg) || ps[0];
  const [name, cs] = cur;
  const up = cs.filter(c => c.State === "running").length;
  const dir = L(cs[0], "com.docker.compose.project.working_dir"), files = L(cs[0], "com.docker.compose.project.config_files");
  const svcs = [...cs].sort((a, b) => (L(a, "com.docker.compose.service") || "").localeCompare(L(b, "com.docker.compose.service") || ""));
  return `<header class="ph"><div><div class="kick">docker compose · ${ps.length} stack${ps.length === 1 ? "" : "s"}</div><h1>Stacks</h1></div></header>
    <div class="stacks">
      <div class="stacklist">${ps.map(([p, pcs]) => {
        const u = pcs.filter(c => c.State === "running").length, bad = pcs.some(c => status(c).bucket === "attention");
        return `<a class="scard" href="#stacks/${encodeURIComponent(p)}" aria-current="${p === name}" style="--h:${hue(p)}">
          <span class="h"><span class="sq" style="width:12px;height:12px;border-radius:4px"></span><b>${esc(p)}</b><span class="pill ${bad ? "s-bad" : u === pcs.length ? "s-ok" : "s-warn"}" style="height:22px">${u}/${pcs.length} up</span></span>
          <span class="svcs">${pcs.slice(0, 12).map(c => `<span class="svcdot"><i style="background:${status(c).dot}"></i>${esc(L(c, "com.docker.compose.service") || cname(c))}</span>`).join("")}${pcs.length > 12 ? `<span class="svcdot">+${pcs.length - 12}</span>` : ""}</span></a>`;
      }).join("")}</div>
      <section class="card sdetail" aria-label="Stack detail" style="--h:${hue(name)}">
        <div class="hd"><div style="min-width:0;display:flex;flex-direction:column;gap:4px"><h2 style="display:flex;align-items:center;gap:10px"><span class="sq" style="width:14px;height:14px;border-radius:4px"></span>${esc(name)}</h2>
          <span class="mono muted" style="font-size:12.5px;overflow-wrap:anywhere">${esc(files || dir || "")}</span></div>
          <div style="display:flex;flex-wrap:wrap;gap:8px">
            <button class="btn primary" data-proj="${esc(name)}" data-pact="start">${icon("play", 17)}Start all</button>
            <button class="btn" data-proj="${esc(name)}" data-pact="restart">${icon("restart", 17)}Restart</button>
            <button class="btn danger" data-proj="${esc(name)}" data-pact="stop">${icon("stop", 17)}Stop all</button></div></div>
        <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:14px 22px 0">
          <span class="muted">${up} of ${cs.length} running · started in <code>depends_on</code> order, stopped in reverse</span>
          ${dir ? `<span style="display:inline-flex;align-items:center;gap:6px" class="muted">compose up ${copyBtn(`cd ${dir} && docker compose -p ${name} up -d`, "Copy 'docker compose up' command")}</span>` : ""}</div>
        <div style="padding:14px 22px 22px;display:flex;flex-direction:column;gap:10px">${svcs.map(c => {
          const st = status(c), deps = (L(c, "com.docker.compose.depends_on") || "").split(",").map(s => s.split(":")[0]).filter(Boolean);
          return `<a class="svc" href="#c/${esc(c.Id)}">${dotHtml(st)}<span style="display:flex;flex-direction:column;min-width:0"><strong>${displayName(c)}</strong><span class="muted" style="font-size:12px">${deps.length ? "needs " + esc(deps.join(", ")) : esc(cname(c))}</span></span>
            <span class="mono" style="font-size:12.5px;color:var(--off-fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${imageHtml(c.Image)}</span><span class="pill ${st.cls}">${st.label}</span></a>`;
        }).join("")}</div>
      </section>
    </div>`;
}

function viewImages() {
  const q = S.q.trim().toLowerCase();
  const usedBy = new Map();
  for (const c of S.containers) { if (!usedBy.has(c.ImageID)) usedBy.set(c.ImageID, []); usedBy.get(c.ImageID).push(c); }
  const max = Math.max(1, ...S.images.map(i => i.Size));
  const list = S.images.map(i => ({ ...i, tags: (i.RepoTags || []).filter(t => t !== "<none>:<none>") }))
    .filter(i => !q || [...i.tags, i.Id].join(" ").toLowerCase().includes(q)).sort((a, b) => b.Size - a.Size);
  return `<header class="ph"><div><div class="kick">${kicker()}</div><h1>Images</h1></div>
      <div class="tools"><label class="field">${icon("search")}<span class="sr">Search images</span><input type="search" id="q" value="${esc(S.q)}" placeholder="Search images…  ( / )"></label>
        <button class="btn primary" id="pull">${icon("pull", 17, 2.2)}<span>Pull image</span></button><button class="btn" id="prune">Prune dangling</button></div></header>
    <div class="table"><div class="scroll"><div class="tr th img-tr"><span>Image</span><span>Size</span><span>Created</span><span>Used by</span><span></span></div>
    ${list.length ? list.map(i => {
      const u = usedBy.get(i.Id) || [];
      return `<div class="tr img-tr" style="cursor:default">
        <div class="nm"><span class="dot" style="background:${u.length ? "var(--ok)" : "var(--off)"}"></span><div><b class="mono" style="font-size:13.5px;font-weight:600">${i.tags.length ? imageHtml(i.tags[0]) : '<span class="muted">&lt;untagged&gt;</span>'}</b>

        <div style="display:flex;flex-direction:column;gap:6px"><span class="mono" style="font-size:12.5px">${fmtBytes(i.Size)}</span><div class="bar"><i style="width:${Math.max(2, i.Size / max * 100)}%;background:${u.length ? "var(--accent)" : "#FFB38A"}"></i></div></div>
        <span class="muted">${ago(i.Created)}</span>
        <div class="ports">${u.length ? u.slice(0, 3).map(c => `<a class="stk" href="#c/${esc(c.Id)}"><span class="dot" style="width:7px;height:7px;background:${status(c).dot}"></span>${esc(cname(c))}</a>`).join("") + (u.length > 3 ? `<span class="stk">+${u.length - 3}</span>` : "") : '<span class="pill s-warn" style="height:22px">unused</span>'}</div>

    }).join("") : `<div class="empty">${BOAT(80)}<strong>No images${q ? " match" : " yet"}</strong></div>`}</div></div>`;
}

function selfCpu() { const h = S.selfHist; return h.length ? h[h.length - 1].cpu : null; }

/* ---------- activity: the audit log ---------- */
const VERB = {
  "container.start": "Started", "container.stop": "Stopped", "container.restart": "Restarted", "container.pause": "Paused",
  "container.unpause": "Resumed", "container.kill": "Killed", "container.remove": "Removed", "container.prune": "Pruned stopped containers",
  "image.pull": "Pulled image", "image.remove": "Removed image", "image.prune": "Pruned dangling images",
  "project.start": "Started stack", "project.stop": "Stopped stack", "project.restart": "Restarted stack",
};
const findContainer = t => S.containers.find(c => c.Id === t || cname(c) === t || (t.length >= 12 && c.Id.startsWith(t)));
function auditTarget(e) {
  const [kind] = e.action.split(".");
  if (kind === "container" && !/prune/.test(e.action)) {
    const c = findContainer(e.target);
    return c ? `<a class="stk" href="#c/${esc(c.Id)}">${esc(cname(c))}</a>` : `<span class="mono muted">${esc(/^[0-9a-f]{64}$/.test(e.target) ? e.target.slice(0, 12) : e.target)}</span>`;
  }
  if (kind === "project") return `<a class="stk" href="#stacks/${encodeURIComponent(e.target)}" style="--h:${hue(e.target)}"><i></i>${esc(e.target)}</a>`;
  if (e.action === "image.remove") return `<span class="mono">${esc(e.target.replace("sha256:", "").slice(0, 12))}</span>`;
  return `<span class="mono">${esc(e.target)}</span>`;
}
const auditWho = e => `<b>${esc(e.user || "anonymous")}</b><span class="muted" style="font-size:12px;display:block">${esc(e.client || "")}${e.ip ? " · " + esc(e.ip) : ""}</span>`;
const auditResult = e => `<span class="pill ${e.ok ? "s-ok" : "s-bad"}">${e.ok ? "Done" : "Failed"}</span>${e.message ? `<span class="muted" style="font-size:12px;display:block;margin-top:4px">${esc(e.message)}</span>` : ""}`;

      <div class="card stat"><div class="top"><span>Failed</span></div><div class="row"><span class="big${es.length - ok ? " red" : ""}">${es.length - ok}</span><span>of ${es.length}</span></div></div>

function historyHtml() {

}

const EXIT_HINT = { 0: "finished normally", 1: "the app reported an error", 125: "docker could not run it", 126: "command not executable", 127: "command not found", 137: "killed: out of memory or force-stopped", 139: "crashed (segfault)", 143: "stopped politely (SIGTERM)" };
function summaryHtml(d) {
  const st = d.State || {}, rp = d.HostConfig?.RestartPolicy?.Name || "no";
  const hc = d.HostConfig || {};
  const lim = [hc.NanoCpus ? (hc.NanoCpus / 1e9) + " CPU" : null, hc.Memory ? fmtBytes(hc.Memory) : null].filter(Boolean).join(" · ") || "no limits";
  const stopped = !st.Running && st.FinishedAt?.[0] !== "0";
  const h = st.Health;
  const checks = (h?.Log || []).slice(-12);
  const hcol = !h ? "var(--muted)" : h.Status === "healthy" ? "var(--ok-fg)" : h.Status === "unhealthy" ? "var(--bad-fg)" : "var(--warn-fg)";
  return `
    <div class="card sum"><span class="k">${st.Running ? "Started" : "Stopped"}</span><strong>${st.Running ? ago(Date.parse(st.StartedAt) / 1000) : stopped ? ago(Date.parse(st.FinishedAt) / 1000) : "never started"}</strong>
      <small>${stopped ? `exit ${st.ExitCode}${EXIT_HINT[st.ExitCode] ? " · " + EXIT_HINT[st.ExitCode] : ""}` : "created " + ago(Date.parse(d.Created) / 1000)}${st.OOMKilled ? " · ran out of memory" : ""}</small></div>
    <div class="card sum"><span class="k">Restarts</span><strong>${d.RestartCount || 0}</strong><small>policy ${esc(rp)}</small></div>
    <div class="card sum"><span class="k">Limits</span><strong>${esc(lim)}</strong><small>${hc.PidsLimit ? "pids " + hc.PidsLimit : "pids unlimited"}${hc.ReadonlyRootfs ? " · read-only root" : ""}</small></div>
    <div class="card sum"><span class="k"><span>Health check</span><span style="color:${hcol};font-weight:700">${h ? esc(h.Status) : "none"}</span></span>
      ${checks.length ? `<div class="checks" role="img" aria-label="Last ${checks.length} health checks: ${checks.filter(x => !x.ExitCode).length} passed">${checks.map(x => `<i style="height:${x.ExitCode ? "100%" : "60%"};background:${x.ExitCode ? "var(--bad)" : "var(--ok)"}"></i>`).join("")}</div>
        <small>${h.FailingStreak ? `${h.FailingStreak} failed in a row` : "last checks passing"}</small>` : `<small>${h ? "no results yet" : "This image defines no health check."}</small>`}</div>`;
}

/* Bar chart in the Modernist style: ink bars, the latest and above-average ones in signal red. */
function spark(v, h = 90) {
  const W = 300, n = v.length, max = Math.max(...v) * 1.15 || 1, avg = v.reduce((a, b) => a + b, 0) / (n || 1);
  const bw = W / Math.max(n, 30), gap = Math.min(2, bw * 0.3);
  const bars = v.map((y, i) => {
    const bh = Math.max(1, y / max * h), x = W - (n - i) * bw;
    return `<rect class="b${i === n - 1 || (y > avg * 1.5 && y > 0) ? " hot" : ""}" x="${x.toFixed(1)}" y="${(h - bh).toFixed(1)}" width="${(bw - gap).toFixed(1)}" height="${bh.toFixed(1)}"/>`;
  }).join("");
  const ty = (h - avg / max * h).toFixed(1);
  return `<svg class="spark" viewBox="0 0 ${W} ${h}" preserveAspectRatio="none" aria-hidden="true" style="height:${h}px">${bars}<line class="th" x1="0" x2="${W}" y1="${ty}" y2="${ty}"/></svg>`;
}
function chartsHtml(s) {
  const H = S.hist;
  const series = k => H.map(x => x[k]).filter(x => x != null);
  const memPct = s?.mem != null && s.mem_limit ? ` <span class="muted" style="font-size:13px;font-weight:500;font-family:var(--body)">${(s.mem / s.mem_limit * 100).toFixed(1)}%</span>` : "";
  const items = [
    ["CPU", s?.cpu != null ? s.cpu.toFixed(1) + "%" : "–", series("cpu")],
    ["Memory", s ? fmtBytes(s.mem) + memPct : "–", series("mem")],
    ["Network in", s?.rxRate != null ? fmtBytes(s.rxRate) + "/s" : "–", series("rxRate")],
    ["Network out", s?.txRate != null ? fmtBytes(s.txRate) + "/s" : "–", series("txRate")],
  ];
  const c = S.containers.find(x => x.Id === S.open);
  const note = c && c.State !== "running" ? `<div class="card" style="grid-column:1/-1"><span class="muted">Live stats appear while the container is running.</span></div>` : "";
  return note + items.map(([t, v, ser]) => `<figure class="card chart"><figcaption><span>${t}</span><span class="big" style="font-size:30px">${v}</span></figcaption>${ser.length > 1 ? spark(ser) : '<div style="height:100px;display:grid;place-items:center" class="muted">waiting for samples…</div>'}</figure>`).join("") +
    `<div class="card" style="grid-column:1/-1;display:flex;gap:24px;flex-wrap:wrap"><span class="muted">Processes <b style="color:var(--text)">${s?.pids ?? "–"}</b></span><span class="muted">Received <b style="color:var(--text)">${s ? fmtBytes(s.rx) : "–"}</b></span><span class="muted">Sent <b style="color:var(--text)">${s ? fmtBytes(s.tx) : "–"}</b></span><span class="muted">Docker samples every second · showing the last ${H.length} s</span></div>`;
}

        ["Depends on", deps.length ? deps.map(x => `<span class="stk">${esc(x)}</span>`).join("") : "–"],
        ["Compose file", `<span class="mono grow">${esc(lb["com.docker.compose.project.config_files"] || "–")}</span>${dir ? copyBtn(`cd ${dir} && docker compose -p ${proj} up -d`, "Copy 'docker compose up' command") : ""}`]);
    }
    const info = $("#d-info");
    if (info) info.innerHTML = `<h2 style="margin-bottom:14px">Details</h2><dl class="kvs">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>`;
    const envBtn = $("#d-envbtn");
    if (envBtn) envBtn.onclick = () => {
      const env = d.Config?.Env || [];
      $("#d-env").textContent = env.length ? [...env].sort().join("\n") : "No environment variables.";
      $("#d-env").classList.remove("muted");
      envBtn.remove();
    };
    if (!st.Running) { const ch = $("#charts"); if (ch) ch.innerHTML = chartsHtml(null); }
  } catch (e) { const info = $("#d-info"); if (info) info.textContent = e.message; }
}

/* ---------- logs ---------- */
const ANSI = /\x1b\[[0-9;]*[A-Za-z]/g, LOG_RE = /^(\d{4}-\d\d-\d\dT[\d:.]+Z) ?/;
const LV = [[/\b(error|err|fatal|panic|exception|crit(ical)?|fail(ed|ure)?)\b/i, "err", "ERR"], [/\bwarn(ing)?\b/i, "wrn", "WRN"], [/\binfo\b/i, "inf", "INF"], [/\b(debug|trace)\b/i, "dbg", "DBG"]];
let logCount = 0, logEnded = false;
function resetLogs() { const el = $("#d-logs"); if (el) { el.innerHTML = ""; logCount = 0; logEnded = false; logFooter(); } }
function logFooter() {
  const n = $("#l-count"); if (n) n.textContent = `${logCount.toLocaleString()} line${logCount === 1 ? "" : "s"}`;
  const s = $("#l-stream"); if (s) s.innerHTML = logEnded ? "· stream ended" : `<span style="color:#8FD6B4">· streaming</span> <span class="caret"></span>`;
}
function appendLogs(lines) {
  const el = $("#d-logs");
  if (!el) return;
  const q = ($("#lq")?.value || "").toLowerCase();
  const html = lines.map(l => {
    l = l.replace(ANSI, "");
    const m = l.match(LOG_RE);
    const body = m ? l.slice(m[0].length) : l;
    const lv = LV.find(([re]) => re.test(body));
    const hide = q && !body.toLowerCase().includes(q) ? " hidden" : "";
    return `<div class="ln${lv ? " " + lv[1] : ""}"${hide}>${m ? `<span class="ts">${esc(new Date(m[1]).toLocaleString())}</span>` : ""}<span class="lv">${lv ? lv[2] : ""}</span><span class="msg">${esc(body) || " "}</span></div>`;
  }).join("");
  el.insertAdjacentHTML("beforeend", html);
  logCount += lines.length;
  const cap = Math.max(1000, +($("#d-tail")?.value || 300));
  while (logCount > cap && el.firstElementChild) { el.firstElementChild.remove(); logCount--; }
  if ($("#l-follow")?.getAttribute("aria-pressed") === "true") el.scrollTop = el.scrollHeight;
  logFooter();
}
function endLogs() {
  logEnded = true;
  const el = $("#d-logs"); if (!el) return;
  const c = S.containers.find(x => x.Id === S.open);
  el.insertAdjacentHTML("beforeend", `<div class="note">${!logCount ? "No log output yet." : c?.State === "running" ? "Log stream ended." : "Container stopped. Logs resume when it starts again."}</div>`);
  logFooter();
}

/* ---------- data: pushed over one SSE stream, re-fetched on change ---------- */
let refreshing = null, lastRefresh = 0;
async function refresh(images = true) {
  if (refreshing) return refreshing;
  lastRefresh = Date.now();
  refreshing = (async () => {
    try {
      const [c, i, info, cfg] = await Promise.all([
        api("/api/containers"),
        images || !S.images.length ? api("/api/images") : null,
        S.info ? null : api("/api/info"),
        S.cfg ? null : api("/api/config"),
      ]);
      S.containers = c; if (i) S.images = i; if (info) S.info = info; if (cfg) S.cfg = cfg;
      render(true);
    } catch (e) {
      setLive(false, e.message);
    } finally { refreshing = null; }
  })();
  return refreshing;
}

async function loadEvents() {
  try {
    const txt = await api("/api/events?since=3600");
    S.events = String(txt).split("\n").filter(Boolean).map(l => { try { return normEvent(JSON.parse(l)); } catch { return null; } })
      .filter(e => e && !/^exec_/.test(e.a)).reverse().concat(S.events).slice(0, 50);
    const el = $("#events"); if (el) el.innerHTML = eventsHtml();
  } catch {}
}

async function loadSelf() {
  try {
    const s = await api("/api/self");
    const prev = S.self, h = S.selfHist;
    if (prev && s.cpu_seconds != null && s.uptime > prev.uptime) h.push({ cpu: Math.max(0, (s.cpu_seconds - prev.cpu_seconds) / (s.uptime - prev.uptime) * 100), rss: s.rss });
    else if (!prev) h.push({ cpu: 0, rss: s.rss });
    if (h.length > 60) h.shift();
    S.self = s;
    const cpu = selfCpu();
    $("#s-pid").textContent = "pid " + s.pid;
    $("#s-cpu").textContent = cpu == null ? "–" : cpu.toFixed(2) + "%";
    $("#s-cpu-bar").style.width = Math.min(100, Math.max(2, (cpu || 0) * 10)) + "%";
    $("#s-mem").textContent = fmtBytes(s.rss);
    $("#s-disk").textContent = fmtBytes(s.exe_bytes);
    $("#f-sock").textContent = s.docker;
    $("#f-ver").textContent = `${s.name} · contraire ${s.version}`;
    if (S.view === "about") $("#view").innerHTML = viewAbout();
  } catch {}
}

function setLive(on, msg) {
  $("#conn").classList.toggle("off", !on);
  $("#connstate").textContent = on ? "Connected · live" : msg ? "Offline · " + msg : "Reconnecting…";
}

let es = null, esKey = null, evTimer = 0, evImages = false, reconnectTimer = 0;
function connect(force) {
  const tail = $("#d-tail")?.value || 300;
  const key = S.open ? `${S.open}/${tail}` : "";
  if (es && key === esKey && !force) return;
  es?.close();
  esKey = key;
  es = new EventSource("/api/stream" + (S.open ? `?c=${encodeURIComponent(S.open)}&tail=${tail}` : ""));
  es.onopen = () => {
    setLive(true);
    // The server replays the log tail on every (re)connect.
    if (S.open) { resetLogs(); S.hist = []; }
    // Catch up on anything missed while disconnected (skipped right after a fresh load).
    if (Date.now() - lastRefresh > 1000) refresh();
  };
  es.onerror = () => setLive(false);
  es.addEventListener("docker", e => onDocker(JSON.parse(e.data)));
  es.addEventListener("stats", e => onStats(JSON.parse(e.data)));
  es.addEventListener("logs", e => appendLogs(e.data.split("\n")));
  es.addEventListener("logend", endLogs);
}

function onDocker(ev) {
  ev.time = ev.time || Date.now() / 1000;
  S.events.unshift(ev);
  if (S.events.length > 50) S.events.pop();
  const el = $("#events"); if (el) el.innerHTML = eventsHtml();
  if (ev.t === "image" || ev.a === "create" || ev.a === "destroy") evImages = true;
  clearTimeout(evTimer);
  evTimer = setTimeout(() => { const im = evImages; evImages = false; refresh(im); }, 120);
  if (ev.t === "container" && S.open && ev.id === S.open) {
    if (ev.a === "destroy") { location.hash = "#containers"; return; }
    setTimeout(loadDetail, 150);
    if (/^(start|restart|unpause)$/.test(ev.a)) { clearTimeout(reconnectTimer); reconnectTimer = setTimeout(() => connect(true), 300); }
  }
}

function onStats(s) {
  const H = S.hist, prev = H[H.length - 1];
  s.rxRate = prev ? Math.max(0, s.rx - prev.rx) : null;
  s.txRate = prev ? Math.max(0, s.tx - prev.tx) : null;
  H.push(s);
  if (H.length > 120) H.shift();
  const el = $("#charts");
  if (el && S.tab === "stats") el.innerHTML = chartsHtml(s);
}

/* ---------- actions ---------- */
async function act(id, action) {
  const c = S.containers.find(x => x.Id === id);
  const label = c ? cname(c) : id.slice(0, 12);
  let path = `/api/containers/${id}/${action}`, method = "POST";
  if (action === "remove") {
    if (!await ask({ title: `Remove ${label}?`, text: "The container and its anonymous filesystem changes will be deleted. Named volumes are kept.", ok: "Remove", danger: true })) return;
    path = `/api/containers/${id}`; method = "DELETE";
  }
  S.busy.add(id); render(true);
  try {
    await api(path, { method });
    toast(`${label}: ${action === "remove" ? "removed" : action + (action.endsWith("e") ? "d" : "ed")}`);
  } catch (e) { toast(`${label}: ${e.message}`, true); }
  S.busy.delete(id);
  refresh();
}

async function projectAct(project, action) {
  if (action !== "start" && !await ask({
    title: `${action === "stop" ? "Stop" : "Restart"} everything in ${project}?`,
    text: "Services are handled in dependency order: dependencies start first and stop last.",
    ok: action === "stop" ? "Stop all" : "Restart all", danger: action === "stop",
  })) return;
  const members = S.containers.filter(c => L(c, PROJ) === project);
  members.forEach(c => S.busy.add(c.Id)); render(true);
  try {
    const r = await api(`/api/projects/${encodeURIComponent(project)}/${action}`, { method: "POST" });
    if (r.failed.length) toast(`${project}: ${r.failed.map(f => `${f.name}: ${f.message}`).join("; ")}`, true);
    else toast(`${project}: ${r.count} container${r.count === 1 ? "" : "s"} ${action === "stop" ? "stopped" : action + "ed"}`);
  } catch (e) { toast(`${project}: ${e.message}`, true); }
  members.forEach(c => S.busy.delete(c.Id));
  refresh();
}

/* ---------- learn: shell in the binary, content fetched from GitHub ---------- */
const Lr = { index: null, slug: null, blobs: new Map() };
const docsBase = () => S.cfg?.docs || "";

async function renderLearn(slug) {
  if (!S.cfg) await refresh(false);
  const view = $("#view");
  if (!Lr.index) {
    view.innerHTML = `<header class="ph"><div><div class="kick">lessons load from GitHub</div><h1>Learn</h1></div></header><div class="card"><div class="skel" style="width:40%"></div></div>`;
    try {
      const r = await fetch(docsBase() + "index.json", { cache: "no-cache" });
      if (!r.ok) throw new Error(r.status + " " + r.statusText);
      Lr.index = await r.json();
    } catch (e) {
      if (S.view !== "learn") return;
      view.innerHTML = `<header class="ph"><div><div class="kick">lessons</div><h1>Learn</h1></div></header>
        <div class="doc"><h1>Lessons live on GitHub</h1><p>To keep this program tiny, the lessons aren't stored in it. Your browser loads them from <code>${esc(docsBase())}</code>, but that didn't work this time (${esc(e.message)}).</p><p>This usually means this device is offline, or the docs address was changed with <code>--docs-url</code>.</p></div>`;
      return;
    }
  }
  if (S.view !== "learn") return;

  slug = slug || Lr.slug || ch[0].slug;
  if (!view.querySelector(".learn")) {
    view.innerHTML = `<header class="ph"><div><div class="kick">${ch.length} lessons · loaded live from GitHub</div><h1>Learn Docker</h1></div></header>
      <div class="learn"><nav class="lnav" aria-label="Lessons">${ch.map((c, i) => `
        <a href="#learn/${esc(c.slug)}" data-learn="${esc(c.slug)}" style="--h:${c.hue ?? hue(c.slug)}"><span class="num">${i + 1}</span><span>${esc(c.title)}<small>${esc(c.minutes)} min · ${esc(c.summary)}</small></span></a>`).join("")}
        <div class="src">Nothing here is stored on this machine. <a href="${esc(Lr.index.source || docsBase())}" target="_blank" rel="noopener">Edit on GitHub</a></div></nav>
        <article class="doc" id="doc"></article></div>`;
  }
  openLesson(slug);
}

async function openLesson(slug) {
  const ch = Lr.index.chapters, i = Math.max(0, ch.findIndex(c => c.slug === slug)), c = ch[i];
  Lr.slug = c.slug;
  if (location.hash !== "#learn/" + c.slug) history.replaceState(null, "", "#learn/" + c.slug);
  document.querySelectorAll(".lnav a").forEach(a => a.classList.toggle("on", a.dataset.learn === c.slug));
  const doc = $("#doc");
  try {
    const r = await fetch(docsBase() + c.file, { cache: "no-cache" });
    if (!r.ok) throw new Error(r.status + " " + r.statusText);
    const src = await r.text();
    if (Lr.slug !== c.slug) return;
    const prev = ch[i - 1], next = ch[i + 1];
    doc.innerHTML = `<div class="kicker">lesson ${i + 1} of ${ch.length} · ${esc(c.minutes)} min</div>` + md(src) +
      `<nav class="next">${prev ? `<a href="#learn/${esc(prev.slug)}" data-learn="${esc(prev.slug)}"><small>Previous</small>← ${esc(prev.title)}</a>` : "<span></span>"}
       ${next ? `<a href="#learn/${esc(next.slug)}" data-learn="${esc(next.slug)}" style="text-align:right"><small>Next</small>${esc(next.title)} →</a>` : ""}</nav>`;
    doc.style.animation = "none"; void doc.offsetWidth; doc.style.animation = "";
    doc.querySelectorAll("img[data-src]").forEach(loadImage);
    window.scrollTo({ top: 0 });
  } catch (e) { doc.innerHTML = `<p class="muted">Couldn't load this lesson: ${esc(e.message)}</p>`; }
}

/* Images go through fetch + blob so SVGs render whatever content type the host serves. */
async function loadImage(img) {
  const url = img.dataset.src;
  try {
    if (!Lr.blobs.has(url)) {
      const r = await fetch(url);
      if (!r.ok) throw 0;
      const ext = url.split(".").pop().toLowerCase();
      const type = { svg: "image/svg+xml", png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", webp: "image/webp", gif: "image/gif" }[ext] || "";
      Lr.blobs.set(url, URL.createObjectURL(new Blob([await r.blob()], { type })));
    }
    img.src = Lr.blobs.get(url);
  } catch { img.replaceWith(Object.assign(document.createElement("span"), { className: "muted", textContent: `[image: ${img.alt}]` })); }
}

/* Small Markdown subset: headings, paragraphs, lists, fenced code, quotes (callouts),
   tables, images, links, bold/italic/code. Everything is escaped before formatting. */
function md(src) {
  const url = u => {
    u = u.replace(/&amp;/g, "&");
    if (/^https?:\/\//.test(u)) return u;
    if (/^[a-z]+:/i.test(u) || u.startsWith("//")) return "#";
    return docsBase() + u.replace(/^\.\//, "");
  };
  const inline = t => t.split(/(`[^`]+`)/).map((part, i) => {
    if (i % 2) return `<code>${esc(part.slice(1, -1))}</code>`;
    return esc(part)
      .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (_, a, u) => `<img alt="${a}" data-src="${esc(url(u))}">`)
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, u) => {
        const lesson = u.match(/^([\w-]+)\.md$/);
        return lesson ? `<a href="#learn/${lesson[1]}" data-learn="${lesson[1]}">${t}</a>` : `<a href="${esc(url(u))}" target="_blank" rel="noopener">${t}</a>`;
      })
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,:;!?]|$)/g, "$1<em>$2</em>");
  }).join("");
  const lines = src.replace(/\r/g, "").split("\n"), out = [];
  for (let i = 0; i < lines.length;) {
    const l = lines[i];
    let m;
    if ((m = l.match(/^```\s*([\w+-]*)/))) {
      const code = [];
      for (i++; i < lines.length && !/^```/.test(lines[i]); i++) code.push(lines[i]);
      i++;
      out.push(`<div class="code">${m[1] ? `<span class="lang">${esc(m[1])}</span>` : ""}<pre><code>${esc(code.join("\n"))}</code></pre><button class="copy" data-copycode>Copy</button></div>`);
    } else if ((m = l.match(/^(#{1,3})\s+(.*)/))) {
      const n = m[1].length;
      out.push(`<h${n} id="${esc(m[2].toLowerCase().replace(/[^\w]+/g, "-"))}">${inline(m[2])}</h${n}>`); i++;
    } else if (/^>\s?/.test(l)) {
      const q = [];
      for (; i < lines.length && /^>\s?/.test(lines[i]); i++) q.push(lines[i].replace(/^>\s?/, ""));
      out.push(`<aside>${inline(q.join(" "))}</aside>`);
    } else if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
      const ordered = /^\s*\d+\./.test(l), items = [];
      for (; i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i]); i++) items.push(lines[i].replace(/^\s*([-*]|\d+\.)\s+/, ""));
      out.push(`<${ordered ? "ol" : "ul"}>${items.map(t => `<li>${inline(t)}</li>`).join("")}</${ordered ? "ol" : "ul"}>`);
    } else if (/^\|/.test(l) && /^\|[\s:|-]+\|$/.test(lines[i + 1] || "")) {
      const cells = r => r.replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const head = cells(l), body = [];
      for (i += 2; i < lines.length && /^\|/.test(lines[i]); i++) body.push(cells(lines[i]));
      out.push(`<div style="overflow-x:auto"><table><thead><tr>${head.map(h => `<th>${inline(h)}</th>`).join("")}</tr></thead><tbody>${body.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
    } else if ((m = l.match(/^!\[([^\]]*)\]\(([^)\s]+)\)\s*$/))) {
      out.push(`<figure>${inline(l)}${m[1] ? `<figcaption>${esc(m[1])}</figcaption>` : ""}</figure>`); i++;
    } else if (!l.trim()) {
      i++;
    } else {
      const p = [];
      for (; i < lines.length && lines[i].trim() && !/^(```|#{1,3}\s|>|\s*([-*]|\d+\.)\s|\||!\[)/.test(lines[i]); i++) p.push(lines[i]);
      if (!p.length) { p.push(l); i++; }
      out.push(`<p>${inline(p.join(" "))}</p>`);
    }
  }
  return out.join("\n");
}

/* ---------- routing + rendering ---------- */
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  const [v, ...rest] = h.split("/");
  const arg = rest.join("/") || null;
  const view = v === "c" ? "container" : ["stacks", "images", "learn", "about", "activity"].includes(v) ? v : "containers";
  const wasOpen = S.open;
  if (view !== S.view) S.q = "";
  S.view = view; S.arg = arg;
  S.open = view === "container" ? arg : null;
  if (S.open !== wasOpen) { S.detail = null; S.hist = []; S.tab = "logs"; }
  document.querySelectorAll("[data-nav]").forEach(a => a.setAttribute("aria-current", a.dataset.nav === (view === "container" ? "containers" : view) ? "page" : "false"));
  if (S.open !== wasOpen) connect();
  if (view === "learn") { Lr.slug = arg; return renderLearn(arg); }
  render();
  if (view === "container") loadDetail();
  if (view === "activity" || view === "container") loadAudit();
  window.scrollTo({ top: 0 });
}

/* `soft`: a data refresh. Keep focus and scroll; on the container page only patch the header. */
function render(soft) {
  $("#n-c").textContent = S.containers.length;
  $("#n-s").textContent = projects().length;
  $("#n-i").textContent = S.images.length;
  if (S.cfg) { $("#brand").textContent = S.cfg.name; $("#mark").textContent = S.cfg.name[0]; }
  if (S.info) {
    $("#hostname").textContent = S.info.name;
    $("#h-cpu").textContent = S.info.cpus;
    $("#h-mem").textContent = fmtBytes(S.info.memory);
    $("#h-ver").textContent = S.info.version;
    document.title = `${S.info.name} · ${S.cfg?.name || ""}`;
  }
  $("#h-disk").textContent = fmtBytes(S.images.reduce((a, i) => a + i.Size, 0));
  if (S.view === "learn") return;
  const view = $("#view");
  if (S.view === "container" && soft && $("#c-head")) {
    const c = S.containers.find(x => x.Id === S.open);
    if (c) $("#c-head").innerHTML = containerHead(c);
    return;
  }
  const html = { containers: viewContainers, stacks: viewStacks, images: viewImages, about: viewAbout, activity: viewActivity, container: viewContainer }[S.view]();
  // Keep the search box's focus and caret across re-renders, so typing isn't interrupted.
  const q = document.activeElement?.id === "q" ? $("#q") : null;
  const pos = q?.selectionStart;
  view.innerHTML = html;
  if (q) { const n = $("#q"); n?.focus(); n?.setSelectionRange(pos, pos); }
}

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  const cp = e.target.closest("[data-copy], [data-copycode]");
  if (cp) {
    e.preventDefault(); e.stopPropagation();
    const text = cp.dataset.copy ?? cp.parentElement.querySelector("code").textContent;
    const ok = await copyText(text);
    if (cp.dataset.copycode !== undefined) { cp.textContent = ok ? "Copied" : "Press Ctrl+C"; cp.classList.toggle("done", ok); setTimeout(() => { cp.textContent = "Copy"; cp.classList.remove("done"); }, 1600); }
    else toast(ok ? "Copied to clipboard" : "Couldn't copy", !ok);
    return;
  }
  if (e.target.closest("[data-stop]")) return;
  const th = e.target.closest("[data-theme-set]");
  if (th) return setTheme(th.dataset.themeSet);
  const lesson = e.target.closest("[data-learn]");
  if (lesson) { e.preventDefault(); return openLesson(lesson.dataset.learn); }
  const f = e.target.closest("[data-filter]");
  if (f) { S.filter = f.dataset.filter; return render(); }
  const pa = e.target.closest("[data-pact]");
  if (pa) return projectAct(pa.dataset.proj, pa.dataset.pact);
  const a = e.target.closest("[data-act]");
  if (a) { e.stopPropagation(); return act(a.dataset.id, a.dataset.act); }
  const rm = e.target.closest("[data-rmi]");
  if (rm) {
    if (!await ask({ title: `Remove ${rm.dataset.label}?`, text: "The image will be deleted from this host.", ok: "Remove", danger: true })) return;
    try { await api(`/api/images/${rm.dataset.rmi}`, { method: "DELETE" }); toast("Image removed"); } catch (err) { toast(err.message, true); }
    return refresh();
  }
  const tab = e.target.closest("[data-tab]");
  if (tab) {
    S.tab = tab.dataset.tab;
    document.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-selected", b === tab));
    for (const k of ["logs", "stats", "details", "env"]) $("#tab-" + k).hidden = k !== S.tab;
    if (S.tab === "stats") $("#charts").innerHTML = chartsHtml(S.hist[S.hist.length - 1] || null);
    return;
  }
  const lvl = e.target.closest("[data-lvl]");
  if (lvl) {
    document.querySelectorAll("[data-lvl]").forEach(b => b.setAttribute("aria-pressed", b === lvl));
    const el = $("#d-logs"); el.classList.toggle("f-err", lvl.dataset.lvl === "err"); el.classList.toggle("f-wrn", lvl.dataset.lvl === "wrn");
    return;
  }
  const tog = e.target.closest("#l-ts, #l-wrap, #l-follow");
  if (tog) {
    const on = tog.getAttribute("aria-pressed") !== "true";
    tog.setAttribute("aria-pressed", on);
    const el = $("#d-logs");
    if (tog.id === "l-ts") el.classList.toggle("ts-on", on);
    if (tog.id === "l-wrap") el.classList.toggle("nowrap", !on);
    if (tog.id === "l-follow" && on) el.scrollTop = el.scrollHeight;
    return;
  }
  if (e.target.closest("#l-dl")) {
    const text = [...document.querySelectorAll("#d-logs .ln")].map(l => [l.querySelector(".ts")?.textContent, l.querySelector(".msg")?.textContent].filter(Boolean).join("  ")).join("\n");
    const c = S.containers.find(x => x.Id === S.open);
    const dl = Object.assign(document.createElement("a"), { href: URL.createObjectURL(new Blob([text + "\n"], { type: "text/plain" })), download: `${c ? cname(c) : "container"}.log` });
    dl.click(); setTimeout(() => URL.revokeObjectURL(dl.href), 1000);
    return;
  }
  if (e.target.closest("#pull")) return pullImage();
  if (e.target.closest("#prune")) return pruneImages();
  const row = e.target.closest("[data-href]");
  if (row && !e.target.closest("a, button")) location.hash = row.dataset.href;
});
document.addEventListener("input", e => {
  if (e.target.id === "q") { S.q = e.target.value; if (S.view === "containers") $("#rows").innerHTML = rowsHtml(); else render(); }
  if (e.target.id === "lq") {
    const q = e.target.value.toLowerCase();
    document.querySelectorAll("#d-logs .ln").forEach(l => { l.hidden = q && !l.textContent.toLowerCase().includes(q); });
  }
});
document.addEventListener("change", e => { if (e.target.id === "d-tail") connect(); });
document.addEventListener("keydown", e => {
  if (!$("#modal").hidden) return;
  const tag = document.activeElement?.tagName;
  if (e.key === "/" && !/INPUT|SELECT|TEXTAREA/.test(tag)) { const q = $("#q") || $("#lq"); if (q) { e.preventDefault(); q.focus(); } }
  if (e.key === "Escape") { if (S.view === "container") location.hash = "#containers"; else if (document.activeElement?.id === "q") { S.q = ""; render(); } }
  if (e.key === "Enter" && document.activeElement?.dataset?.href) location.hash = document.activeElement.dataset.href;
});
async function pullImage() {
  const ref = await ask({ title: "Pull image", text: "Image reference, e.g. nginx:alpine or ghcr.io/owner/app:1.2", ok: "Pull",
    extra: '<label class="field" style="margin-bottom:16px"><input type="text" placeholder="repository[:tag]" spellcheck="false" aria-label="Image reference"></label>' });
  if (!ref || !ref.trim()) return;
  const btn = $("#pull"); if (btn) { btn.disabled = true; btn.querySelector("span").textContent = "Pulling…"; }
  try { await api("/api/images/pull", { method: "POST", body: JSON.stringify({ image: ref.trim() }) }); toast(`Pulled ${ref.trim()}`); }
  catch (e) { toast(e.message, true); }
  refresh();
}
async function pruneImages() {
  if (!await ask({ title: "Prune dangling images?", text: "Removes untagged images not used by any container.", ok: "Prune", danger: true })) return;
  try { const r = await api("/api/images/prune", { method: "POST" }); toast(`Reclaimed ${fmtBytes(r.SpaceReclaimed || 0)}`); } catch (e) { toast(e.message, true); }
  refresh();
}

/* Boot. Routes: #containers, #stacks[/name], #images, #learn[/lesson], #about, #c/<id>. */
setTheme((() => { try { return localStorage.getItem("theme") || "auto"; } catch { return "auto"; } })());
window.addEventListener("hashchange", route);
(async () => {
  await refresh();
  route();
  connect();
  loadEvents();
  loadSelf();
})();
/* Pushed events cover every change; this slow poll only refreshes texts like "Up 5 minutes". */
setInterval(() => { if (!document.hidden) refresh(false); }, 15000);
setInterval(() => { if (!document.hidden) loadSelf(); }, 3000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(false); });
</script>
</body>
