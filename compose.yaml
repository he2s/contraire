# Run the dashboard itself with Compose:  docker compose up -d
# Then open http://<host>:8083
services:
  contraire:
    build: .
    image: contraire:latest
    restart: unless-stopped
    ports:
      - "8083:8083"
    volumes:
      # Control of the Docker socket is root-equivalent on this host.
      - /var/run/docker.sock:/var/run/docker.sock
      # State folder: audit log (≤ 2 MB), API tokens, incident postmortems (≤ 100) and minute metrics (≤ 4 MB).
      - contraire-state:/state
      # Per-container CPU and memory come straight from the host's cgroup files.
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    # Needed to see the host's cgroups and container processes (network counters).
    # The socket above already gives full control of the host, so this adds no power.
    cgroup: host
    pid: host
    environment:
      # Strongly recommended when the port is reachable from your network:
      # CONTRAIRE_PASSWORD: change-me
      CONTRAIRE_LISTEN: 0.0.0.0:8083
      CONTRAIRE_AUDIT_FILE: /state/audit.jsonl
    mem_limit: 32m
    # Fedora/RHEL (SELinux enforcing) blocks containers from the Docker socket.
    # This lifts SELinux confinement for this one container:
    # security_opt:
    #   - label=disable

volumes:
  contraire-state:
