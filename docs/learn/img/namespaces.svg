<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" height="270"><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;fill:#16181d}
.t{font-size:15px;font-weight:650}.s{font-size:12px;fill:#5f6571}.m{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.hw{fill:#eceef1;stroke:#d5d8de}.os{fill:#e4e4f7;stroke:#c5c5ef}.box{fill:#fff;stroke:#d5d8de}
.a{fill:#5b5bd6}.a2{fill:#8d8de6}.a3{fill:#b7b7f0}.g{fill:#e3f5ec;stroke:#9fd8bd}.o{fill:#fbf1df;stroke:#ecd0a0}.ln{stroke:#9aa0ab;stroke-width:1.5;fill:none}.w{fill:#fff}
@media (prefers-color-scheme: dark){text{fill:#e8eaee}.s{fill:#a0a7b3}.hw{fill:#22252c;stroke:#30343d}.os{fill:#23234a;stroke:#3a3a6e}.box{fill:#16181d;stroke:#30343d}.a{fill:#8b8bf5}.a2{fill:#6a6ad8}.a3{fill:#4b4bb0}.g{fill:#12291f;stroke:#25543f}.o{fill:#2d2412;stroke:#5a4520}.ln{stroke:#6c7380}.w{fill:#e8eaee}}
</style>
<rect x="30" y="20" width="660" height="230" rx="14" class="hw"/>
<text x="50" y="46" class="t">Linux host</text><text x="670" y="46" text-anchor="end" class="s">all processes share one kernel</text>
<g transform="translate(50,62)">
 <rect width="290" height="120" rx="12" class="g"/>
 <text x="16" y="26" class="t">container "web"</text>
 <text x="16" y="50" class="m">PID 1  nginx</text><text x="16" y="68" class="m">net    172.17.0.2</text><text x="16" y="86" class="m">mnt    image layers</text><text x="16" y="104" class="m">uts    hostname "web"</text>
</g>
<g transform="translate(380,62)">
 <rect width="290" height="120" rx="12" class="g"/>
 <text x="16" y="26" class="t">container "db"</text>
 <text x="16" y="50" class="m">PID 1  postgres</text><text x="16" y="68" class="m">net    172.17.0.3</text><text x="16" y="86" class="m">mnt    image layers</text><text x="16" y="104" class="m">uts    hostname "db"</text>
</g>
<rect x="50" y="196" width="620" height="38" rx="10" class="os"/>
<text x="360" y="220" text-anchor="middle" class="s">Kernel · namespaces (what each can see) · cgroups (how much each may use)</text>
</svg>
